name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps don't need git credentials; don't leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make setup
      - run: make check
      - run: make audit
      - uses: ./.github/actions/mcp-publisher
      - name: Validate server.json for the MCP Registry
        run: |
          ./mcp-publisher validate
