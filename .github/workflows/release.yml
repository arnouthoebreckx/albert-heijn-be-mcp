name: Release

on:
  push:
    tags: ["v*"]

# Every job asks for what it needs; this is what a job gets that does not.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release and its files.
      contents: write
      # The npm package, on GitHub Packages, with the workflow's own token.
      packages: write
      # The build provenance of the tarball is signed with this workflow's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps don't need git credentials; don't leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@arnouthoebreckx'
          # npm advises against caches in release builds.
          package-manager-cache: false
      # No dependency needs install scripts; skipping them keeps a compromised one from running code here.
      - run: npm ci --ignore-scripts
      - name: Check tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          for v in $(jq -r .version server.json) $(jq -r .version manifest.json); do
            [ "$v" = "$version" ] || { echo "server.json or manifest.json has version $v, package.json $version"; exit 1; }
          done
          # The packages of server.json have no version of their own: the .mcpb URL and the image tag carry it.
          mcpb=$(jq -r '.packages[] | select(.registryType == "mcpb") | .identifier' server.json)
          [ "$mcpb" = "https://github.com/arnouthoebreckx/albert-heijn-be-mcp/releases/download/v$version/albert-heijn-be-mcp.mcpb" ] ||
            { echo "the mcpb package of server.json is $mcpb, not the .mcpb of v$version"; exit 1; }
          oci=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)
          [ "$oci" = "ghcr.io/arnouthoebreckx/albert-heijn-be-mcp:$version" ] ||
            { echo "the oci package of server.json is $oci, not the image of $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run build
      # One fixed name, so releases/latest/download/albert-heijn-be-mcp.tgz always works; the tag in the URL picks a version.
      - name: Pack
        run: mv "$(npm pack --silent)" albert-heijn-be-mcp.tgz
      # The .mcpb bundle installs in desktop apps with a double-click: the npm package plus the manifest,
      # the larger logo and production dependencies. .mcpbignore leaves out files that never run.
      - name: Pack .mcpb bundle
        env:
          npm_config_ignore_scripts: "true"
        run: |
          tar xzf albert-heijn-be-mcp.tgz
          cp manifest.json .mcpbignore package-lock.json package/
          cp assets/logo.png package/assets/
          (cd package && npm ci --omit=dev)
          npx -y @anthropic-ai/mcpb@2.1.2 pack package albert-heijn-be-mcp.mcpb
      # Creates the release, without notes (they are written by hand), unless it already exists (e.g. drafted by hand).
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "albert-heijn-be-mcp $VERSION" --notes "" --verify-tag
          gh release upload "$GITHUB_REF_NAME" albert-heijn-be-mcp.tgz albert-heijn-be-mcp.mcpb --clobber
      # GitHub Packages takes the tarball with the workflow's own token: the tag is the household's approval.
      # A version already there is skipped.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(npm view "@arnouthoebreckx/albert-heijn-be-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "@arnouthoebreckx/albert-heijn-be-mcp $VERSION is already on GitHub Packages"
          else
            npm publish albert-heijn-be-mcp.tgz
          fi

  # Builds the image for both platforms and pushes it to GHCR with the workflow's own token. It checks the
  # versions itself first. Run it again by re-running the workflow.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The build provenance is signed with this workflow's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          for v in $(jq -r .version server.json) $(jq -r .version manifest.json); do
            [ "$v" = "$version" ] || { echo "server.json or manifest.json has version $v, package.json $version"; exit 1; }
          done
          # The packages of server.json have no version of their own: the .mcpb URL and the image tag carry it.
          mcpb=$(jq -r '.packages[] | select(.registryType == "mcpb") | .identifier' server.json)
          [ "$mcpb" = "https://github.com/arnouthoebreckx/albert-heijn-be-mcp/releases/download/v$version/albert-heijn-be-mcp.mcpb" ] ||
            { echo "the mcpb package of server.json is $mcpb, not the .mcpb of v$version"; exit 1; }
          oci=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)
          [ "$oci" = "ghcr.io/arnouthoebreckx/albert-heijn-be-mcp:$version" ] ||
            { echo "the oci package of server.json is $oci, not the image of $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The release tag is vMAJOR.MINOR.PATCH for a release, and carries a suffix (v1.1.0-rc.1) for a pre-release, which doesn't move latest.
      - name: Tag the image from the release tag
        id: tags
        run: |
          tags="ghcr.io/arnouthoebreckx/albert-heijn-be-mcp:${VERSION}"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="$tags,ghcr.io/arnouthoebreckx/albert-heijn-be-mcp:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Links the package to this repository, so the workflow's token may push it.
          labels: |
            org.opencontainers.image.source=https://github.com/arnouthoebreckx/albert-heijn-be-mcp
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/arnouthoebreckx/albert-heijn-be-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
