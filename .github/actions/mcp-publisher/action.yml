name: Install mcp-publisher
description: Downloads the MCP Registry publisher into the working directory.
runs:
  using: composite
  steps:
    # It runs with the workflow's credentials, so it is pinned to a version and checksum. To update,
    # pick a release of modelcontextprotocol/registry and take the sha256 of mcp-publisher_linux_amd64.tar.gz.
    - shell: bash
      env:
        VERSION: v1.8.1
        SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      run: |
        curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
        echo "$SHA256  mcp-publisher.tar.gz" | sha256sum -c
        tar xzf mcp-publisher.tar.gz mcp-publisher
